name: Run Artisan Command on VPS

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Artisan command to run (e.g., saldo:normalize-master -n)'
        required: true
        default: 'saldo:normalize-master -n'

jobs:
  run-artisan:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Artisan Command on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            cd /www/wwwroot/sim.cahayatasbih.or.id
            
            PHP_BIN=""
            for candidate in /www/server/php/84/bin/php /www/server/php/83/bin/php /www/server/php/82/bin/php /www/server/php/81/bin/php "$(command -v php || true)"; do
                if [ -n "$candidate" ] && [ -x "$candidate" ] && "$candidate" -m 2>/dev/null | grep -qi '^pdo_mysql$'; then
                    PHP_BIN="$candidate"
                    break
                fi
            done
            if [ -z "$PHP_BIN" ]; then
                PHP_BIN="/www/server/php/84/bin/php"
            fi
            
            echo "Running: php artisan ${{ github.event.inputs.command }}"
            $PHP_BIN artisan ${{ github.event.inputs.command }}
