name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - "3306:3306"
        options: --health-cmd="mysqladmin ping --silent"

    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, bcmath, gd, mysql, zip, redis
          tools: composer
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader --no-scripts
      - name: Install JS dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Create storage directories
        run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/app/public
      - name: Generate key
        run: php artisan key:generate
      - name: Run composer post-install tasks
        run: |
          composer dump-autoload --optimize
          php artisan package:discover --ansi
      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate -n
      - name: Create storage symlink
        run: php artisan storage:link
      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  deploy:
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git remote set-url origin https://github.com/kanjengsenopati/sandbox-cahayatasbih.git || true
            git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kanjengsenopati/sandbox-cahayatasbih.git main
            git reset --hard FETCH_HEAD
            composer install --no-dev --optimize-autoloader
            npm ci
            npm run build
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            php artisan queue:restart
