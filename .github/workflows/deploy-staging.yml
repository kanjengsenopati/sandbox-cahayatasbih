name: Deploy Staging to VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to VPS via Rsync
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: "/www/wwwroot/sim.cahayatasbih.or.id"
          EXCLUDE: "/.git/, /.github/, /node_modules/, /vendor/, /.env, /storage/, /public/.user.ini"

      - name: Run Post-Deploy Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /www/wwwroot/sim.cahayatasbih.or.id
            mkdir -p bootstrap/cache storage/framework/sessions storage/framework/views storage/framework/cache
            chmod -R 777 bootstrap/cache storage

            PHP_BIN="/www/server/php/84/bin/php"
            if [ ! -f "$PHP_BIN" ]; then
                PHP_BIN="php"
            fi

            $PHP_BIN artisan optimize:clear || true
            $PHP_BIN artisan view:clear || true
            rm -rf storage/framework/views/*.php 2>/dev/null || true

            $PHP_BIN /usr/bin/composer install --no-dev --optimize-autoloader || composer install --no-dev --optimize-autoloader || true
            $PHP_BIN artisan migrate --force || true
            $PHP_BIN artisan config:cache || true
            $PHP_BIN artisan route:cache || true
            $PHP_BIN artisan view:cache || true

            $PHP_BIN -r "if(function_exists('opcache_reset')){opcache_reset();}" || true

            chown -R www:www /www/wwwroot/sim.cahayatasbih.or.id
            chmod -R 775 bootstrap/cache storage

            $PHP_BIN artisan tinker --execute="
                echo '=== ADMINS ON STAGING DB ===' . PHP_EOL;
                App\Models\Admin::take(10)->get(['id','name','email','is_active'])->each(function(\$a) {
                    echo \$a->email . ' | Active: ' . \$a->is_active . PHP_EOL;
                });
                foreach (['dev@gmail.com', 'superadmin@gmail.com'] as \$email) {
                    \$admin = App\Models\Admin::where('email', \$email)->first();
                    if (\$admin) {
                        \$admin->password = bcrypt('password');
                        \$admin->is_active = 1;
                        \$admin->save();
                        echo \$email . ' password set to: password' . PHP_EOL;
                    }
                }
            " || true

            # Set queue to database
            sed -i 's/QUEUE_CONNECTION=sync/QUEUE_CONNECTION=database/g' .env

            /etc/init.d/php-fpm-84 reload 2>/dev/null || /etc/init.d/php-fpm-84 restart 2>/dev/null || true
            nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null || true

            # Restart queue worker (fix SSH hang by detaching stdin/stdout)
            pkill -f "artisan queue:work" || true
            nohup $PHP_BIN artisan queue:work --sleep=3 --tries=3 --max-time=3600 </dev/null >/dev/null 2>&1 &
