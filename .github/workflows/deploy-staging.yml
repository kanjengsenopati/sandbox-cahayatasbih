name: Deploy Staging to VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to VPS via Rsync
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: "/www/wwwroot/sim.cahayatasbih.or.id"
          EXCLUDE: "/.git/, /.github/, /node_modules/, /vendor/, /.env, /storage/"

      - name: Run Post-Deploy Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /www/wwwroot/sim.cahayatasbih.or.id
            mkdir -p bootstrap/cache storage/framework/sessions storage/framework/views storage/framework/cache
            chmod -R 777 bootstrap/cache storage

            PHP_BIN="/www/server/php/84/bin/php"
            if [ ! -f "$PHP_BIN" ]; then
                PHP_BIN="php"
            fi

            $PHP_BIN artisan optimize:clear || true
            $PHP_BIN artisan view:clear || true
            rm -rf storage/framework/views/*.php 2>/dev/null || true

            $PHP_BIN /usr/bin/composer install --no-dev --optimize-autoloader || composer install --no-dev --optimize-autoloader || true
            $PHP_BIN artisan migrate --force || true
            $PHP_BIN artisan config:cache || true
            $PHP_BIN artisan route:cache || true
            $PHP_BIN artisan view:cache || true

            $PHP_BIN -r "if(function_exists('opcache_reset')){opcache_reset();echo 'OPcache reset'.PHP_EOL;}" || true

            chown -R www:www /www/wwwroot/sim.cahayatasbih.or.id
            chmod -R 775 bootstrap/cache storage

            echo "=== VPS LOCAL CURL TEST ==="
            curl -s -k http://127.0.0.1/login -H "Host: sim.cahayatasbih.or.id" | grep -n "onkeydown" || echo "LOCAL CURL NO ONKEYDOWN"

            echo "=== NGINX REWRITE CONFIG ==="
            cat /www/server/panel/vhost/rewrite/sim.cahayatasbih.or.id.conf 2>/dev/null || echo "No rewrite config"

            echo "=== ALL NGINX VHOST SITES ==="
            ls -la /www/server/panel/vhost/nginx/ 2>/dev/null || ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true

            echo "=== CHECKING PHP-FPM PROCESSES & SERVICES ==="
            ps aux | grep -i "php-fpm" | head -n 10 || true
            ls -la /etc/init.d/php* 2>/dev/null || true

            echo "=== RELOADING PHP-FPM ==="
            /etc/init.d/php-fpm-84 reload || /etc/init.d/php-fpm-84 restart || systemctl restart php-fpm-84 || pkill -USR2 -f "php-fpm: master" || true

            echo "=== RE-CHECKING LOCAL CURL AFTER RELOAD ==="
            curl -s -k http://127.0.0.1/login -H "Host: sim.cahayatasbih.or.id" | grep -n "onkeydown" || echo "AFTER RELOAD STILL NO ONKEYDOWN"

            echo "=== NGINX ACCESS LOG (LAST 10 REQUESTS) ==="
            tail -n 10 /www/wwwlogs/sim.cahayatasbih.or.id.log 2>/dev/null || echo "No access log found"



