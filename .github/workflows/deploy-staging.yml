name: Deploy Staging to VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to VPS via Rsync
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: "/www/wwwroot/sim.cahayatasbih.or.id"
          EXCLUDE: "/.git/, /.github/, /node_modules/, /vendor/, /.env, /storage/"

      - name: Run Post-Deploy Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /www/wwwroot/sim.cahayatasbih.or.id
            mkdir -p bootstrap/cache storage/framework/sessions storage/framework/views storage/framework/cache
            chmod -R 777 bootstrap/cache storage

            PHP_BIN="/www/server/php/84/bin/php"
            if [ ! -f "$PHP_BIN" ]; then
                PHP_BIN="php"
            fi

            $PHP_BIN artisan optimize:clear || true
            $PHP_BIN artisan view:clear || true
            rm -rf storage/framework/views/*.php 2>/dev/null || true

            $PHP_BIN /usr/bin/composer install --no-dev --optimize-autoloader || composer install --no-dev --optimize-autoloader || true
            $PHP_BIN artisan migrate --force || true
            $PHP_BIN artisan config:cache || true
            $PHP_BIN artisan route:cache || true
            $PHP_BIN artisan view:cache || true

            $PHP_BIN -r "if(function_exists('opcache_reset')){opcache_reset();echo 'OPcache reset'.PHP_EOL;}" || true

            chown -R www:www /www/wwwroot/sim.cahayatasbih.or.id
            chmod -R 775 bootstrap/cache storage

            echo "=== CHECKING CERTS ON VPS ==="
            ls -la /www/server/panel/vhost/cert/ || true

            echo "=== CHECKING SANDBOX REWRITE ==="
            cat /www/server/panel/vhost/rewrite/sandbox.cahayatasbih.or.id.conf || true

            echo "=== CONFIGURING SIM NGINX REWRITE ==="
            printf 'location / {\n    try_files $uri $uri/ /index.php?$query_string;\n}\n' > /www/server/panel/vhost/rewrite/sim.cahayatasbih.or.id.conf

            echo "=== CONFIGURING SIM NGINX VHOST ROOT TO /public ==="
            sed -i 's|root /www/wwwroot/sim.cahayatasbih.or.id;|root /www/wwwroot/sim.cahayatasbih.or.id/public;|g' /www/server/panel/vhost/nginx/sim.cahayatasbih.or.id.conf

            echo "=== ADDING SSL / PORT 443 TO SIM NGINX VHOST IF CERT EXISTS ==="
            # If cert exists for sim or wildcard, or copy from sandbox
            if [ -d "/www/server/panel/vhost/cert/sim.cahayatasbih.or.id" ]; then
                CERT_DIR="/www/server/panel/vhost/cert/sim.cahayatasbih.or.id"
            elif [ -d "/www/server/panel/vhost/cert/cahayatasbih.or.id" ]; then
                CERT_DIR="/www/server/panel/vhost/cert/cahayatasbih.or.id"
            elif [ -d "/www/server/panel/vhost/cert/sandbox.cahayatasbih.or.id" ]; then
                CERT_DIR="/www/server/panel/vhost/cert/sandbox.cahayatasbih.or.id"
            fi
            echo "Selected CERT_DIR: $CERT_DIR"

            # Check if sim config already has listen 443
            if ! grep -q "listen 443" /www/server/panel/vhost/nginx/sim.cahayatasbih.or.id.conf; then
                # Insert listen 443 ssl and cert into sim config
                sed -i "/listen 80;/a \    listen 443 ssl http2;\n    ssl_certificate $CERT_DIR/fullchain.pem;\n    ssl_certificate_key $CERT_DIR/privkey.pem;\n    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;\n    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;\n    ssl_prefer_server_ciphers on;" /www/server/panel/vhost/nginx/sim.cahayatasbih.or.id.conf
            fi

            echo "=== FIXING OPEN_BASEDIR AND .USER.INI ==="
            chattr -i /www/wwwroot/sim.cahayatasbih.or.id/.user.ini 2>/dev/null || true
            chattr -i /www/wwwroot/sim.cahayatasbih.or.id/public/.user.ini 2>/dev/null || true
            rm -f /www/wwwroot/sim.cahayatasbih.or.id/.user.ini 2>/dev/null || true
            rm -f /www/wwwroot/sim.cahayatasbih.or.id/public/.user.ini 2>/dev/null || true
            echo "open_basedir=/www/wwwroot/sim.cahayatasbih.or.id/:/tmp/" > /www/wwwroot/sim.cahayatasbih.or.id/.user.ini
            echo "open_basedir=/www/wwwroot/sim.cahayatasbih.or.id/:/tmp/" > /www/wwwroot/sim.cahayatasbih.or.id/public/.user.ini
            chattr +i /www/wwwroot/sim.cahayatasbih.or.id/.user.ini 2>/dev/null || true
            chattr +i /www/wwwroot/sim.cahayatasbih.or.id/public/.user.ini 2>/dev/null || true

            echo "=== CHECKING ENABLE-PHP-84 CONFIG ==="
            cat /www/server/nginx/conf/enable-php-84.conf 2>/dev/null || true

            echo "=== TESTING NGINX CONFIG ==="
            nginx -t || /www/server/nginx/sbin/nginx -t || true

            echo "=== RELOADING NGINX ==="
            nginx -s reload || /www/server/nginx/sbin/nginx -s reload || systemctl reload nginx || /etc/init.d/nginx reload || true

            echo "=== RELOADING PHP-FPM ==="
            /etc/init.d/php-fpm-84 reload || /etc/init.d/php-fpm-84 restart || true

            echo "=== TESTING CURL ON VPS AFTER OPEN_BASEDIR FIX ==="
            curl -iv -k https://127.0.0.1/login -H "Host: sim.cahayatasbih.or.id" 2>&1 | grep -n "onkeydown" || echo "STILL NO ONKEYDOWN AFTER FIX"



