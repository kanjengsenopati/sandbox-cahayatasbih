name: Cleanup Student Balances

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (simulate only, no database write)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT || '22' }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Run Cleanup Balances on VPS
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "🔍 Running in DRY-RUN mode (no database write)"
          else
            echo "⚡ Running in LIVE mode (will write to database)"
          fi

          ssh -o StrictHostKeyChecking=no -p $VPS_PORT $VPS_USER@$VPS_HOST <<EOF
            set -e
            cd $DEPLOY_PATH

            echo "=== Cleaning Up Student Balances ==="
            /www/server/php/84/bin/php artisan db:cleanup-balances $DRY_RUN_FLAG

            echo "=== Cleanup Finished ==="
          EOF
