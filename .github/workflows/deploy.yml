name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT || '22' }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p $VPS_PORT $VPS_USER@$VPS_HOST <<EOF
            set -e
            cd $DEPLOY_PATH

            echo "=== Pulling latest changes ==="
            git config --global --add safe.directory $DEPLOY_PATH
            git remote set-url origin https://github.com/kanjengsenopati/sandbox-cahayatasbih.git || true
            git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kanjengsenopati/sandbox-cahayatasbih.git main
            git reset --hard FETCH_HEAD

            echo "=== Refreshing Autoloader ==="
            composer dump-autoload --optimize

            echo "=== Installing dependencies & Building Assets ==="
            [ -d "node_modules" ] || npm ci
            chmod -R +x node_modules/.bin 2>/dev/null || true
            npm run build

            echo "=== Building PWA ==="
            echo "Membersihkan artefak build lama..."
            rm -rf portalwalisantri/dist/client || true
            rm -rf public/portalwalisantri/dist/assets || true
            rm -f public/portalwalisantri/dist/sw.js || true
            rm -f public/portalwalisantri/dist/registerSW.js || true
            rm -f public/portalwalisantri/dist/index.html || true
            rm -f public/workbox-*.js || true
            cd portalwalisantri
            [ -d "node_modules" ] || npm ci
            chmod -R +x node_modules/.bin 2>/dev/null || true
            npm run build
            cd $DEPLOY_PATH

            echo "=== Running Migrations ==="
            cd $DEPLOY_PATH
            /www/server/php/84/bin/php artisan migrate --force

            echo "=== Fixing Master Rates 2026/2027 ==="
            /www/server/php/84/bin/php artisan bills:fix-rates-2026 || echo "Fix rates 2026 failed"

            echo "=== Cleaning Up Cross School Rates ==="
            /www/server/php/84/bin/php artisan bills:fix-cross-school-rates || echo "Fix cross school rates failed"

            echo "=== Syncing Payment Rate Bills ==="
            /www/server/php/84/bin/php artisan bills:sync-rate --force || echo "Sync rate failed"

            echo "=== Cleaning Up Ghost & Duplicate Bills ==="
            /www/server/php/84/bin/php artisan bills:cleanup-ghost-duplicates || echo "Ghost & Duplicate bills cleanup failed"

            echo "=== Running Seeders ==="
            /www/server/php/84/bin/php artisan db:seed --class=KaryawanOutletSeeder --force || echo "Seeder failed"

            echo "=== Creating Storage Symlink ==="
            /www/server/php/84/bin/php artisan storage:link || echo "Storage link may already exist"

            echo "=== Optimizing & Caching Laravel ==="
            /www/server/php/84/bin/php artisan config:cache
            /www/server/php/84/bin/php artisan route:cache
            /www/server/php/84/bin/php artisan view:cache

            echo "=== Running Audit ==="
            /www/server/php/84/bin/php artisan app:audit || echo "Audit failed"

            echo "=== Cleaning Up Student Balances ==="
            /www/server/php/84/bin/php artisan db:cleanup-balances || echo "Balance cleanup failed"

            echo "=== Running Diagnostics ==="
            /www/server/php/84/bin/php diagnose_perwalian.php || echo "Diagnostic failed"

            echo "=== Fixing Permissions (Fast Safe Operation) ==="
            chown -R www:www $DEPLOY_PATH || echo "Failed to chown"
            chmod -R 775 $DEPLOY_PATH/storage $DEPLOY_PATH/bootstrap/cache || echo "Failed to chmod storage/cache"
            chmod -R +x $DEPLOY_PATH/node_modules/.bin $DEPLOY_PATH/portalwalisantri/node_modules/.bin 2>/dev/null || true
            chmod 660 $DEPLOY_PATH/.env || chmod 600 $DEPLOY_PATH/.env || echo "Failed to secure .env"

            echo "=== Deployment Finished Successfully ==="
          EOF
