name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT || '22' }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Source Code
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          echo "Attempting to pull latest changes directly on the VPS..."
          
          # Create a script to run on the VPS for git pull
          cat << 'INNER_EOF' > sync_script.sh
          set -e
          cd $DEPLOY_PATH
          git config --global --add safe.directory $DEPLOY_PATH
          git remote set-url origin https://github.com/kanjengsenopati/sandbox-cahayatasbih.git || true
          
          echo "Trying git fetch (default)..."
          if git fetch https://x-access-token:${GITHUB_TOKEN}@github.com/kanjengsenopati/sandbox-cahayatasbih.git main; then
              echo "Git fetch succeeded."
          else
              echo "Default fetch failed. Trying with IPv4 forced..."
              git fetch -4 https://x-access-token:${GITHUB_TOKEN}@github.com/kanjengsenopati/sandbox-cahayatasbih.git main
          fi
          git reset --hard FETCH_HEAD
          INNER_EOF
          
          # Execute the sync script on VPS
          if ssh -o StrictHostKeyChecking=no -p $VPS_PORT $VPS_USER@$VPS_HOST "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} DEPLOY_PATH=$DEPLOY_PATH bash -s" < sync_script.sh; then
            echo "Source code synced successfully via Git."
          else
            echo "Git pull failed on VPS. Falling back to rsync..."
            rsync -avz --delete \
              --exclude='.git' \
              --exclude='storage' \
              --exclude='bootstrap/cache' \
              --exclude='.env' \
              --exclude='node_modules' \
              --exclude='vendor' \
              --exclude='public/storage' \
              -e "ssh -o StrictHostKeyChecking=no -p $VPS_PORT" \
              ./ $VPS_USER@$VPS_HOST:$DEPLOY_PATH/
          fi

      - name: Build and Restart on VPS
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -p $VPS_PORT $VPS_USER@$VPS_HOST <<EOF
            set -e
            cd $DEPLOY_PATH
            
            echo "=== Refreshing Autoloader ==="
            /www/server/php/84/bin/php /usr/bin/composer dump-autoload --optimize

            echo "=== Installing dependencies & Building Assets ==="
            if [ ! -d "node_modules" ]; then npm ci; else npm install --prefer-offline --no-audit --no-fund; fi
            npm run build

            echo "=== Building PWA ==="
            echo "Membersihkan artefak build lama..."
            rm -rf portalwalisantri/dist/client || true
            rm -rf public/portalwalisantri/dist/assets || true
            rm -f public/portalwalisantri/dist/sw.js || true
            rm -f public/portalwalisantri/dist/registerSW.js || true
            rm -f public/portalwalisantri/dist/index.html || true
            rm -f public/workbox-*.js || true
            cd portalwalisantri
            if [ ! -d "node_modules" ]; then npm ci; else npm install --prefer-offline --no-audit --no-fund; fi
            npm run build
            cd $DEPLOY_PATH

            echo "=== Running Migrations ==="
            cd $DEPLOY_PATH
            /www/server/php/84/bin/php artisan migrate --force

            echo "=== Running Virtual Bill Auto-Repair & Sync ==="
            /www/server/php/84/bin/php artisan bills:fix-virtual-details || true

            echo "=== Recalculating Running Saldo Balances ==="
            /www/server/php/84/bin/php artisan saldo:recalculate || true

            echo "=== Creating Storage Symlink ==="
            /www/server/php/84/bin/php artisan storage:link || echo "Storage link may already exist"

            echo "=== Clearing ALL Old Caches & View Storage ==="
            /www/server/php/84/bin/php artisan optimize:clear
            /www/server/php/84/bin/php artisan view:clear
            rm -rf $DEPLOY_PATH/storage/framework/views/*.php 2>/dev/null || true

            echo "=== Rebuilding Laravel Caches ==="
            /www/server/php/84/bin/php artisan config:cache
            /www/server/php/84/bin/php artisan route:cache

            echo "=== Clearing PHP OPcache ==="
            /www/server/php/84/bin/php -r "if(function_exists('opcache_reset')){opcache_reset();echo 'OPcache cleared via CLI'.PHP_EOL;}else{echo 'OPcache not available via CLI'.PHP_EOL;}"

            echo "=== Restarting PHP-FPM to flush OPcache ==="
            systemctl restart php-fpm-84 2>/dev/null \
              || service php-fpm-84 restart 2>/dev/null \
              || /etc/init.d/php-fpm-84 restart 2>/dev/null \
              || pkill -USR2 -f "php-fpm.*84" 2>/dev/null \
              || echo "WARNING: Could not restart PHP-FPM. OPcache may still serve stale files."

            echo "=== Fixing Permissions (Targeted Fast Operation) ==="
            chown -R www:www $DEPLOY_PATH/storage $DEPLOY_PATH/bootstrap/cache $DEPLOY_PATH/public $DEPLOY_PATH/portalwalisantri/dist 2>/dev/null || true
            chmod -R 775 $DEPLOY_PATH/storage $DEPLOY_PATH/bootstrap/cache 2>/dev/null || true
            chmod -R +x $DEPLOY_PATH/node_modules/.bin $DEPLOY_PATH/portalwalisantri/node_modules/.bin 2>/dev/null || true
            chmod 660 $DEPLOY_PATH/.env || chmod 600 $DEPLOY_PATH/.env || echo "Failed to secure .env"

            echo "=== Deployment Finished Successfully ==="
          EOF
